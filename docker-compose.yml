services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hallucination-detector-api:latest
    container_name: hallucination-api
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Port 8000 is still available for direct curl/testing
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: hallucination-detector-ui:latest
    container_name: hallucination-dashboard
    ports:
      - "8501:8501"
    environment:
      # This points Streamlit to the internal Docker name of the API
      - BACKEND_URL=http://api:8000/detect
    depends_on:
      - api
    restart: unless-stopped