services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    image: hallucination-detector:latest
    container_name: hallucination-detector-api
    ports:
      - "8000:8000"
    environment:
      # Overrides settings.py default to talk to the Windows host
      - OLLAMA_HOST=http://host.docker.internal:11434
      # You can add others here only if you want to override your code defaults
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped