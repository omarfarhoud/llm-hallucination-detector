[project]
name = "llm-hallucination-detector"
version = "0.1.0"
description = "Multi-signal LLM hallucination detection system with RAG integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    # LLM & Embeddings
    "litellm>=1.17.0",
    "sentence-transformers>=2.3.1",
    # Data processing
    "pandas>=2.1.4",
    "numpy>=1.26.3",
    # Dashboard
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    # Utilities
    "python-multipart>=0.0.6",
    "tqdm>=4.66.1",
    "ollama>=0.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "matplotlib-inline>=0.2.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]
