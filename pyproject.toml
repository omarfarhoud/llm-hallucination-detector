[project]
name = "llm-hallucination-detector"
version = "0.1.0"
description = "Multi-signal LLM hallucination detection system with RAG integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

# Core shared dependencies
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.4",
    "numpy>=1.26.3",
]

[project.optional-dependencies]
# Dependencies specifically for the FastAPI backend and ML logic
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "litellm>=1.17.0",
    "sentence-transformers>=2.3.1",
    # Pinned to the CPU build: the default torch wheel bundles ~6-8GB of CUDA
    # libraries we never use (embedding runs on CPU; the LLM is on the host).
    "torch>=2.0.0",
    "ollama>=0.6.1",
    "python-multipart>=0.0.6",
    "tqdm>=4.66.1",
]
# Dependencies specifically for the Streamlit UI
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
# Standard development tools
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# On Linux (Docker image + deploy host, neither of which has a GPU), resolve
# torch from PyTorch's CPU-only wheel index instead of the default PyPI wheel,
# which drags in the full NVIDIA CUDA stack (~6-8GB). Shrinks the image from
# ~13GB to ~2GB. On other platforms (e.g. the Windows dev host with a GPU),
# torch resolves normally so local GPU runs are unaffected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[dependency-groups]
# Extra visualization/analysis tools used in dev
dev = [
    "matplotlib>=3.10.8",
    "matplotlib-inline>=0.2.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]